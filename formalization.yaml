    - method: "agent"
      models: ["Aristotle", "Gemini"]
      framework: "AI-assisted Lean 4 formalization"
      tool_setup: >-
        Formalization and challenge development assisted by Aristotle and Gemini.

review:
  status: "self-assessed"
