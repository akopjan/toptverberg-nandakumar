# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sixfold Tverberg Counterexamples and Convex Equipartition Obstructions"
  description: >-
    We construct a counterexample to the generalized Nandakumar--Ramana Rao
    problem: in every dimension d ≥ 24, there are d − 1 continuous functionals
    on convex bodies and a probability measure such that there is no convex
    partition of the unit ball into six parts of equal measure on which all
    these functionals are equalized. We also show that the topological Tverberg
    conjecture fails for sixfold intersections already in ℝ⁶: we construct a
    continuous map Δ³⁵ → ℝ⁶ whose images of six pairwise disjoint faces never
    meet.
  authors:
    - "Arseniy Akopyan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arseniy Akopyan"

classification:
  arxiv: ["math.CO", "math.MG", "math.AT"]
  msc2020: ["52C35", "55M20", "52A20", "55S91"]

sources:
  - title: "Sixfold Tverberg counterexamples and convex equipartition obstructions"
    authors:
      - "Arseniy Akopyan"
    type: "paper"
    location: "paper/manuscript.tex, Theorems A and B"
    relationship: "formalizes"
    author_endorsement: "participated"
    year: 2026
    note: >-
      Theorem A (AkopyanSixfold.tverberg_counterexample) is formalized
      unconditionally, together with its join-padded extension for all d ≥ 6
      (tverberg_counterexample_ge_six) and fivefold join for d ≥ 36
      (fivefold_tverberg_join, padded_tverberg_ge_36) in Solution.lean. Theorem B
      (AkopyanSixfold.convex_partition_counterexample) is formalized for
      absolutely continuous probability measures in every dimension d ≥ 24
      conditional only on a central blocking configuration IsBlocking p
      (Lemma 5.1), proving the Blaschke selection theorem
      (blaschke_isCompact_subsets_unitBall), the central-avoidance margin
      (exists_eta_of_isBlocking, Lemma 5.2), join-padding from Theorem A
      (Lemma 3.3), Hausdorff-continuous inward-distance transfer (Lemma 5.3),
      concentrated-measure fairness (Lemma 5.4), and a normalized Lebesgue ball
      witness; for d ≥ 36, convex_partition_counterexample_ge_36 handles 5d
      central blocking markers without [AKS].

status:
  scope: >-
    Sorry-free Lean 4 formalization of AkopyanSixfold.tverberg_counterexample
    (unconditional proof of Theorem A: an almost six-embedding Δ³⁵ → ℝ⁶),
    tverberg_counterexample_ge_six (Δ^(5d+5) → ℝ^d for d ≥ 6),
    fivefold_tverberg_join (Δ¹⁷⁹ → ℝ³⁴), padded_tverberg_ge_36 (Δ^(5d-1) → ℝ^(d-2)
    for d ≥ 36), twofold_seven_color_join (Δ⁴¹ → ℝ⁷ implies Δ⁸³ → ℝ¹⁵),
    blaschke_isCompact_subsets_unitBall (Blaschke selection theorem),
    exists_eta_of_isBlocking (Lemma 5.2),
    AkopyanSixfold.convex_partition_counterexample (conditional only on
    IsBlocking p when d ≥ 24), convex_partition_counterexample_ge_18
    (conditional on Δ⁸⁹ → ℝ¹⁶ and IsBlocking p when d ≥ 18), and
    convex_partition_counterexample_ge_36 (conditional only on IsBlocking p for
    5d markers when d ≥ 36). Verified with comparator under standard Lean 4
    axioms [propext, Quot.sound, Classical.choice] without custom axioms or sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "AkopyanSixfold.tverberg_counterexample"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
    - declaration: "AkopyanSixfold.convex_partition_counterexample"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    AkopyanSixfold.tverberg_counterexample formalizes Theorem A unconditionally.
    In paper/manuscript.tex, Theorems 1.1 and B are unconditional: Section 3
    produces an almost six-embedding Δ¹¹⁹ → ℝ²² (Theorem C) and pads it
    d − 24 times to Δ^(5d−1) → ℝ^(d−2) (Corollary 3.4), Section 4 bounds the
    semialgebraic parameter dimension of central six-cone skeleta, and
    Lemmas 5.1--5.2 construct 5d rational blocking markers and a central-avoidance
    radius eta ∈ (0, 1). In Challenge.lean, neither Theorem C nor the
    semialgebraic blocking construction (Theorem 4.1 / Lemma 5.1) is formalized;
    instead, AkopyanSixfold.convex_partition_counterexample takes a central
    blocking tuple p of 5d − 4 markers satisfying IsBlocking p (with neither
    g₀ nor eta in the hypothesis) and states the existence of d − 1 continuous
    functionals Phi and an absolutely continuous probability measure mu ≪ volume.
    Internally, Solution.lean proves the Blaschke selection theorem
    (blaschke_isCompact_subsets_unitBall via Mathlib's NonemptyCompacts),
    deduces Lemma 5.2 (exists_eta_of_isBlocking), proves the binary join lemma
    join_almostSixEmbedding, the unconditional d ≥ 6 Tverberg extension
    tverberg_counterexample_ge_six, the unconditional fivefold join
    fivefold_tverberg_join : Δ¹⁷⁹ → ℝ³⁴ and padded_tverberg_ge_36 (for d ≥ 36),
    twofold_seven_color_join (Δ⁴¹ → ℝ⁷ implies Δ⁸³ → ℝ¹⁵), join-padding d − 8
    times from Theorem A to Δ^(5d−5) → ℝ^(d−2) (Lemma 3.3), Hausdorff continuity
    via Hahn--Banach separation and inward-distance transfer (Lemma 5.3), the
    concentrated-measure fairness lemma (Lemma 5.4), a normalized Lebesgue ball
    witness, the d ≥ 18 reduction convex_partition_counterexample_ge_18, and
    convex_partition_counterexample_ge_36 (d ≥ 36, taking 5d central blocking
    markers without [AKS]). Note that the semialgebraic dimension count of
    Lemma 5.1 requires 5d markers rather than 5d − 4, and that the explicit
    uniform quantifier (∀ mu ...) is proved internally rather than exposed as a
    separate conjunct in Challenge.lean.

automation:
  methods:
    - method: "agent"
      models: ["Aristotle", "Gemini"]
      framework: "AI-assisted Lean 4 formalization"
      tool_setup: >-
        Theorem A proof closure in RequestProject/ assisted by Aristotle;
        join-padding, inward-distance transfer, concentrated-measure proofs, and
        integration assisted by Gemini.

review:
  status: "self-assessed"

alignment:
  namespace: "AkopyanSixfold"
  statements:
    - source: "Sixfold Tverberg counterexamples and convex equipartition obstructions (paper/manuscript.tex), Theorem A"
      lean: "AkopyanSixfold.tverberg_counterexample"
      module: "Challenge"
      status: "proved (unconditional)"
      note: >-
        Unconditional proof of an almost six-embedding Δ³⁵ → ℝ⁶.
    - source: "Sixfold Tverberg counterexamples and convex equipartition obstructions (paper/manuscript.tex), Theorem B"
      lean: "AkopyanSixfold.convex_partition_counterexample"
      module: "Challenge"
      status: "proved (conditional only on central IsBlocking p)"
      note: >-
        Formalizes Theorem B for an absolutely continuous probability measure in
        every dimension d ≥ 24, conditional only on an explicit central blocking
        tuple of 5d − 4 markers (IsBlocking p), with neither g₀ nor eta as
        hypotheses. Solution.lean proves the Blaschke selection theorem,
        Lemma 5.2 (exists_eta_of_isBlocking), the binary join lemma, join-padding
        from Theorem A (Lemma 3.3), 1-Lipschitz Hausdorff-continuous
        inward-distance transfer (Lemma 5.3), concentrated-measure fairness lemma
        (Lemma 5.4), and normalized Lebesgue ball witness, as well as the 5d
        [AKS]-free version convex_partition_counterexample_ge_36 for d ≥ 36,
        while omitting Theorem C (Δ¹¹⁹ → ℝ²²) and the semialgebraic blocking
        construction (Theorem 4.1 / Lemma 5.1).
